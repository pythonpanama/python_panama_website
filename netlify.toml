[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

# CSP hashes are generated from the final HTML in dist/_headers.
# Keep Netlify from rewriting that HTML after the hashes are calculated.
[build.processing]
skip_processing = true

# Each route is prerendered (scripts/prerender.mjs writes dist/_redirects with
# the rewrites); unknown paths get dist/404.html with a real 404 status.
[[redirects]]
from = "/formulario-voluntario"
to = "/quiero-ayudar"
status = 301

[[redirects]]
from = "/formulario-python-route"
to = "/python-route"
status = 301

[[redirects]]
from = "/blog/python-panama-2024-ENG"
to = "/blog/python-panama-2024-eng"
status = 301
